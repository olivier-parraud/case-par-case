<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Case par Case</title>
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Case par Case">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<script>
  // Thème appliqué avant l'affichage, pour éviter un flash clair ou sombre
  (function () { try {
    var p = JSON.parse(localStorage.getItem('cpc:set') || '{}'), t = p.theme || 'dark';
    if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t; document.documentElement.dataset.paper = p.paper || 'black';
    if (localStorage.getItem('cpc:rail') === 'true') document.documentElement.classList.add('rail-start');
  } catch (e) {} })();
</script>
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>

<div id="app">
  <aside id="side" aria-label="Navigation"></aside>
  <main id="main">
    <section id="v-home" class="view" hidden></section>
    <section id="v-series" class="view" hidden></section>
    <section id="v-discover" class="view" hidden></section>
    <section id="v-search" class="view" hidden></section>
    <section id="v-fiche" class="view" hidden></section>
    <section id="v-list" class="view" hidden></section>
    <section id="v-settings" class="view" hidden></section>
  </main>
</div>

<nav id="tabs" aria-label="Navigation principale"></nav>

<section id="reader" hidden aria-label="Lecture">
  <div id="stage">
    <div id="flip"><div id="layer"><canvas id="blank" width="10" height="10"></canvas><canvas id="sharp" width="1" height="1"></canvas><div id="hole"></div></div></div>
    <div class="tapzones" aria-hidden="true"><div>Précédente</div><div>Commandes</div><div>Suivante</div></div>
  </div>
  <div id="rload" hidden><span class="spin"></span><span></span></div>
  <div id="mini" aria-hidden="true"><canvas width="1" height="1"></canvas><i></i></div>
  <button id="exitfs" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>Quitter le plein écran</button>
  <div id="rhint" role="status"></div>
  <header id="rtop" class="chrome">
    <button class="ricon" data-act="back" aria-label="Fermer le tome">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="ti"><b id="rTitle"></b><small id="rSeries"></small></div>
    <div class="tools">
      <div class="seg sm wide-only" id="rModeTop" role="group" aria-label="Mode de lecture"><span class="thumb"></span><button data-mode="panel">Case par case</button><button data-mode="page">Page entière</button></div>
      <button class="ricon" id="fsBtn" aria-label="Plein écran">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>
  <footer id="rbot" class="chrome">
    <div class="prog">
      <span class="lab" id="pos">Page 1 / 1</span>
      <input type="range" id="slider" min="1" max="1" value="1" aria-label="Aller à la page">
      <span class="lab" id="count">Case 1 / 1</span>
    </div>
    <div class="ctl">
      <div class="seg mode phone-only" id="rMode" role="group" aria-label="Mode de lecture"><span class="thumb"></span><button data-mode="panel">Case par case</button><button data-mode="page">Page entière</button></div>
      <div class="seg dir" id="rDir" role="group" aria-label="Sens de lecture"><span class="thumb"></span><button data-dir="ltr">BD →</button><button data-dir="rtl">← Manga</button></div>
    </div>
  </footer>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/pdf.min.js?v=10"></script>
<script src="vendor/jszip.min.js?v=10"></script>
<script src="core.js?v=10"></script>
<script src="panels.js?v=10"></script>
<script src="reader.js?v=10"></script>
<script src="catalog.js?v=10"></script>
<script src="ui.js?v=10"></script>
</body>
</html>
